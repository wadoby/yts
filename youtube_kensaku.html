<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube動画検索サイト</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 25px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        label {
            display: inline-block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
            margin-right: 5px;
        }
        #searchInput {
            width: calc(100% - 100px);
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            vertical-align: middle;
            margin-right: 10px;
        }
        button {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
            vertical-align: middle;
        }
        button:hover {
            background-color: #0056b3;
        }
        .search-options {
            margin-top: 15px;
            margin-bottom: 15px;
        }
        .search-options select {
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            margin-right: 10px;
        }
        #videoPlayerContainer {
            margin-top: 30px;
            text-align: center;
            display: none; /* 初期状態では非表示 */
        }
        #videoPlayer {
            width: 100%;
            max-width: 760px;
            height: 427.5px; /* 16:9 のアスペクト比 */
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #e9ecef;
        }
        #videoActions { /* 動画URLコピーボタン用のコンテナ */
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        #searchResults {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .video-item {
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, border-color 0.2s ease;
            cursor: pointer;
        }
        .video-item:hover {
            transform: translateY(-5px);
            border-color: #007bff;
        }
        .video-item img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
        }
        .video-item-info {
            padding: 15px;
        }
        .video-item-info h3 {
            font-size: 1.1em;
            margin-top: 0;
            margin-bottom: 10px;
            height: 44px; /* タイトルが2行まで表示されるように高さを固定 */
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .video-item-info p {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }
        .video-item-info .duration { /* 動画時間表示用のスタイル */
            font-weight: bold;
            color: #007bff;
        }
        .error-message {
            color: #dc3545;
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
        }
        .copy-button {
            background-color: #28a745; /* 緑系の色 */
        }
        .copy-button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>YouTube動画検索</h1>

        <p>検索キーワードを入力してください:</p>
        <input type="text" id="searchInput" placeholder="例: 面白い猫動画" size="60">
        <button onclick="searchVideos()">検索</button>
        <div id="errorMessage" class="error-message"></div>

        <div class="search-options">
            <label for="sortBy">並び替え:</label>
            <select id="sortBy">
                <option value="relevance">関連性</option>
                <option value="date">公開日</option>
                <option value="viewCount">再生回数</option>
            </select>

            <label for="videoDuration" style="margin-left: 20px;">動画の長さ:</label>
            <select id="videoDuration">
                <option value="any">すべて</option>
                <option value="short">短尺 (< 4分)</option>
                <option value="medium">中尺 (4～20分)</option>
                <option value="long">長尺 (> 20分)</option>
            </select>
        </div>

        <div id="videoPlayerContainer">
            <h2>選択された動画</h2>
            <iframe id="videoPlayer" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            <div id="videoActions">
                </div>
        </div>

        <div id="searchResults">
            </div>
    </div>

    <script>
        const YOUTUBE_API_KEY = 'AIzaSyB0LSbvLaLh8cC6jvN9Ip09Glv70nTlByQ'; // あなたのAPIキー

        async function searchVideos() {
            const query = document.getElementById('searchInput').value;
            const sortBy = document.getElementById('sortBy').value;
            const videoDuration = document.getElementById('videoDuration').value;
            const searchResultsDiv = document.getElementById('searchResults');
            const errorMessageDiv = document.getElementById('errorMessage');
            const videoPlayerContainer = document.getElementById('videoPlayerContainer');
            const videoPlayer = document.getElementById('videoPlayer');
            const videoActionsDiv = document.getElementById('videoActions'); // 追加

            // エラーメッセージと前回の検索結果をクリア
            errorMessageDiv.textContent = '';
            searchResultsDiv.innerHTML = '';
            videoPlayerContainer.style.display = 'none';
            videoPlayer.src = '';
            videoActionsDiv.innerHTML = ''; // ボタンをクリア

            if (!query.trim()) {
                errorMessageDiv.textContent = '検索キーワードを入力してください。';
                return;
            }

            if (YOUTUBE_API_KEY === 'YOUR_YOUTUBE_API_KEY' || !YOUTUBE_API_KEY || YOUTUBE_API_KEY.includes('YOUR_YOUTUBE_API_KEY')) {
                 errorMessageDiv.textContent = 'YouTube Data APIキーが設定されていません。コード内の指示に従って設定してください。';
                 return;
             }

            // snippetとcontentDetailsの両方を取得
            let apiUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=20&key=${YOUTUBE_API_KEY}`;
            apiUrl += `&order=${sortBy}`;
            if (videoDuration !== 'any') {
                apiUrl += `&videoDuration=${videoDuration}`;
            }

            try {
                const searchResponse = await fetch(apiUrl);
                if (!searchResponse.ok) {
                    const errorData = await searchResponse.json();
                    throw new Error(`API検索エラー: ${errorData.error.message || searchResponse.statusText}`);
                }
                const searchData = await searchResponse.json();

                if (searchData.items.length === 0) {
                    searchResultsDiv.innerHTML = '<p style="text-align: center;">検索結果が見つかりませんでした。</p>';
                    return;
                }

                // 動画IDのリストを作成してcontentDetailsをまとめて取得
                const videoIds = searchData.items.map(item => item.id.videoId).join(',');
                const contentDetailsUrl = `https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${videoIds}&key=${YOUTUBE_API_KEY}`;

                const contentResponse = await fetch(contentDetailsUrl);
                if (!contentResponse.ok) {
                    const errorData = await contentResponse.json();
                    throw new Error(`API詳細情報取得エラー: ${errorData.error.message || contentResponse.statusText}`);
                }
                const contentData = await contentResponse.json();

                // contentDetailsをvideoIdでマップ化
                const contentDetailsMap = new Map();
                contentData.items.forEach(item => {
                    contentDetailsMap.set(item.id, item.contentDetails.duration);
                });

                searchData.items.forEach(item => {
                    const videoId = item.id.videoId;
                    const title = item.snippet.title;
                    const thumbnailUrl = item.snippet.thumbnails.medium.url;
                    const channelTitle = item.snippet.channelTitle;
                    const publishTime = new Date(item.snippet.publishTime).toLocaleDateString('ja-JP');
                    const durationISO = contentDetailsMap.get(videoId); // ISO 8601形式の動画時間
                    const formattedDuration = formatDuration(durationISO); // 読みやすい形式に変換

                    const videoItem = document.createElement('div');
                    videoItem.classList.add('video-item');
                    videoItem.dataset.videoId = videoId; 

                    videoItem.innerHTML = `
                        <img src="${thumbnailUrl}" alt="${title}">
                        <div class="video-item-info">
                            <h3>${title}</h3>
                            <p>チャンネル: ${channelTitle}</p>
                            <p>公開日: ${publishTime}</p>
                            <p class="duration">時間: ${formattedDuration}</p>
                        </div>
                    `;
                    searchResultsDiv.appendChild(videoItem);

                    videoItem.addEventListener('click', () => {
                        playVideo(videoId);
                    });
                });

            } catch (error) {
                console.error('検索中にエラーが発生しました:', error);
                errorMessageDiv.textContent = `動画の検索中にエラーが発生しました: ${error.message}`;
            }
        }

        // ISO 8601形式の時間をHH:MM:SS形式に変換するヘルパー関数
        function formatDuration(iso8601Duration) {
            if (!iso8601Duration) return 'N/A'; // 時間が取得できない場合

            const match = iso8601Duration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
            if (!match) return 'N/A';

            const hours = parseInt(match[1] || 0);
            const minutes = parseInt(match[2] || 0);
            const seconds = parseInt(match[3] || 0);

            let result = '';
            if (hours > 0) {
                result += hours + ':';
            }
            result += String(minutes).padStart(2, '0') + ':';
            result += String(seconds).padStart(2, '0');
            return result;
        }


        // 動画をiframeで再生する関数
        function playVideo(videoId) {
            const videoPlayerContainer = document.getElementById('videoPlayerContainer');
            const videoPlayer = document.getElementById('videoPlayer');
            const videoActionsDiv = document.getElementById('videoActions'); // 追加
            
            const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`; 
            const youtubeUrl = `https://www.youtube.com/watch?v=${videoId}`; // YouTube公式URL

            videoPlayer.src = embedUrl;
            videoPlayerContainer.style.display = 'block';
            videoPlayerContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });

            // 動画URLをコピーするボタンを生成
            videoActionsDiv.innerHTML = `
                <button class="copy-button" onclick="copyVideoUrl('${youtubeUrl}')">動画URLをコピー</button>
            `;
        }

        // 動画URLをクリップボードにコピーする関数
        function copyVideoUrl(url) {
            navigator.clipboard.writeText(url).then(() => {
                alert('動画のURLをクリップボードにコピーしました！\n' + url + '\n\nこのURLをブラウザで開くか、必要に応じてダウンロードツールをご利用ください。');
            }).catch(err => {
                console.error('URLコピーに失敗しました:', err);
                alert('URLのコピーに失敗しました。手動でコピーしてください: ' + url);
            });
        }
    </script>
</body>
</html>
